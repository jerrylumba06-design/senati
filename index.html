<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Iniciar sesión | SENATI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      color: #f5f5f5; background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.08), transparent 45%),
        #080808;
    }
    .login-card {
      width: min(100%, 420px); padding: 42px 36px; border: 1px solid #292929;
      border-radius: 22px; background: rgba(17,17,17,.94);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 34px; }
    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px;
      background: #f5f5f5; color: #090909; font-size: 21px; font-weight: 900;
    }
    .brand-name { font-size: 19px; font-weight: 800; letter-spacing: 2px; }
    .brand-name span { color: #999; font-weight: 400; }
    h1 { text-align: center; font-size: 28px; letter-spacing: -.7px; margin-bottom: 9px; }
    .subtitle { text-align: center; color: #929292; font-size: 14px; margin-bottom: 32px; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 9px; color: #dedede; font-size: 13px; font-weight: 600; }
    input {
      width: 100%; height: 49px; padding: 0 14px; border: 1px solid #333;
      border-radius: 10px; outline: none; background: #0c0c0c; color: #fff; font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #666; }
    input:focus { border-color: #aaa; box-shadow: 0 0 0 3px rgba(255,255,255,.07); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 76px; }
    .toggle {
      position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
      border: 0; background: transparent; color: #aaa; cursor: pointer; font-size: 12px;
    }
    .toggle:hover { color: #fff; }
    .options { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 24px; }
    .remember { display: flex; align-items: center; gap: 8px; color: #aaa; font-size: 12px; }
    .remember input { width: 14px; height: 14px; accent-color: #fff; }
    a { color: #ddd; font-size: 12px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .submit {
      width: 100%; height: 50px; border: 0; border-radius: 10px; background: #f2f2f2;
      color: #090909; font-size: 14px; font-weight: 800; cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .submit:hover { background: #d7d7d7; transform: translateY(-1px); }
    .message { min-height: 20px; margin-top: 14px; color: #f0b6b6; text-align: center; font-size: 12px; }
    .footer { margin-top: 26px; padding-top: 20px; border-top: 1px solid #292929; text-align: center; color: #777; font-size: 11px; line-height: 1.6; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card { padding: 34px 24px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand" aria-label="SENATI">
      <div class="brand-mark">S</div>
      <div class="brand-name">SENATI <span>| PORTAL</span></div>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">Ingresa tus datos para continuar</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario o correo electrónico</label>
        <input id="username" name="username" type="text" placeholder="Ingresa tu usuario" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
          <button class="toggle" type="button" id="togglePassword" aria-label="Mostrar contraseña">Mostrar</button>
        </div>
      </div>

      <div class="options">
        <label class="remember"><input type="checkbox" name="remember"> Recordarme</label>
        <a href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="submit" type="submit">INICIAR SESIÓN</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>

    <footer class="footer">© 2026 SENATI · Portal de acceso<br>Interfaz de demostración</footer>
  </main>

  <script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    toggleButton.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleButton.textContent = isHidden ? 'Ocultar' : 'Mostrar';
      toggleButton.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        message.textContent = 'Completa tu usuario y contraseña.';
        return;
      }

      message.textContent = 'Interfaz lista. Conecta un backend para validar tus credenciales.';
    });

    document.getElementById('forgotLink').addEventListener('click', (event) => {
      event.preventDefault();
      message.textContent = 'La recuperación de contraseña debe configurarse en el sistema.';
    });
  </script>
</body>
</html>
