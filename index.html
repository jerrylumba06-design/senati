<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f472b6">
  <title>Iniciar sesión | SENATI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      position: relative; overflow: hidden; isolation: isolate; color: #fff1f8;
      background-color: #120814;
      background-image:
        linear-gradient(rgba(10, 4, 12, .38), rgba(10, 4, 12, .52)),
        url("https://thumbs.dreamstime.com/b/peru-flag-symbol-tech-cyber-data-concept-editable-strokes-collection-bright-neon-design-468426513.jpg");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      background-attachment: fixed;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    body::after {
      content: ""; position: fixed; width: 440px; height: 440px; border: 1px solid rgba(255,190,225,.25);
      border-radius: 50%; right: -180px; top: -190px; z-index: -1;
      box-shadow: 0 0 0 35px rgba(255,190,225,.04), 0 0 0 75px rgba(255,190,225,.03);
    }
    .login-card {
      width: min(100%, 430px); padding: 42px 36px; position: relative;
      border: 1px solid rgba(255,190,225,.35); border-radius: 24px;
      background: rgba(28, 8, 25, .78); color: #fff1f8;
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 25px 90px rgba(30,0,24,.48), 0 0 35px rgba(255,105,180,.16);
    }
    .login-card::before {
      content: ""; position: absolute; top: -1px; left: 12%; right: 12%; height: 2px;
      background: linear-gradient(90deg, transparent, #ff9bd2, transparent);
      box-shadow: 0 0 18px #ff79bd;
    }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 34px; }
    .brand-mark {
      width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px;
      background: linear-gradient(135deg, #ffb4dc, #f472b6); color: #4a1232; font-size: 21px; font-weight: 900; box-shadow: 0 0 22px rgba(244,114,182,.35);
    }
    .brand-name { font-size: 19px; font-weight: 800; letter-spacing: 2px; }
    .brand-name span { color: #f9a8d4; font-weight: 400; }
    h1 { text-align: center; font-size: 28px; letter-spacing: -.7px; margin-bottom: 9px; }
    .subtitle { text-align: center; color: #d9a9c5; font-size: 14px; margin-bottom: 32px; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 9px; color: #f7d9e9; font-size: 13px; font-weight: 600; }
    input {
      width: 100%; height: 49px; padding: 0 14px; border: 1px solid rgba(244,114,182,.32);
      border-radius: 10px; outline: none; background: rgba(17,5,15,.72); color: #fff1f8; font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #a77b95; }
    input:focus { border-color: #f9a8d4; box-shadow: 0 0 0 3px rgba(244,114,182,.16), 0 0 18px rgba(244,114,182,.12); }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 76px; }
    .toggle {
      position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
      border: 0; background: transparent; color: #f9a8d4; cursor: pointer; font-size: 12px;
    }
    .toggle:hover { color: #fff; text-shadow: 0 0 10px #ff79bd; }
    .options { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 24px; }
    .remember { display: flex; align-items: center; gap: 8px; color: #d9a9c5; font-size: 12px; }
    .remember input { width: 14px; height: 14px; accent-color: #f472b6; }
    a { color: #ffadd8; font-size: 12px; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .submit {
      width: 100%; height: 50px; border: 1px solid rgba(255,255,255,.25); border-radius: 10px;
      background: linear-gradient(100deg, #f472b6, #fb8cc8 55%, #d946a1);
      color: #3b0828; font-size: 14px; font-weight: 800; cursor: pointer;
      box-shadow: 0 8px 24px rgba(244,114,182,.28);
      transition: background .2s, transform .2s;
    }
    .submit:hover { background: linear-gradient(100deg, #f9a8d4, #f472b6); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(244,114,182,.4); }
    .message { min-height: 20px; margin-top: 14px; color: #ffadd8; text-align: center; font-size: 12px; }
    .footer { margin-top: 26px; padding-top: 20px; border-top: 1px solid rgba(255,190,225,.2); text-align: center; color: #bd8aa8; font-size: 11px; line-height: 1.6; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-card { padding: 34px 24px; }
      h1 { font-size: 25px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand" aria-label="SENATI">
      <div class="brand-mark">S</div>
      <div class="brand-name">SENATI <span>| PORTAL</span></div>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">Ingresa tus datos para continuar</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Usuario o correo electrónico</label>
        <input id="username" name="username" type="text" placeholder="Ingresa tu usuario" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
          <button class="toggle" type="button" id="togglePassword" aria-label="Mostrar contraseña">Mostrar</button>
        </div>
      </div>

      <div class="options">
        <label class="remember"><input type="checkbox" name="remember"> Recordarme</label>
        <a href="#" id="forgotLink">¿Olvidaste tu contraseña?</a>
      </div>

      <button class="submit" type="submit">INICIAR SESIÓN</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>

    <footer class="footer">© 2026 SENATI · Portal de acceso<br>Interfaz de demostración</footer>
  </main>

  <script>
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');

    toggleButton.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      toggleButton.textContent = isHidden ? 'Ocultar' : 'Mostrar';
      toggleButton.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        message.textContent = 'Completa tu usuario y contraseña.';
        return;
      }

      message.textContent = 'Interfaz lista. Conecta un backend para validar tus credenciales.';
    });

    document.getElementById('forgotLink').addEventListener('click', (event) => {
      event.preventDefault();
      message.textContent = 'La recuperación de contraseña debe configurarse en el sistema.';
    });
  </script>
</body>
</html>
